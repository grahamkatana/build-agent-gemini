services:
  db:
    image: postgres:16-alpine
    container_name: tbs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tshwane_bus}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - tbs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tshwane_bus}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  tbs_pgdata:
